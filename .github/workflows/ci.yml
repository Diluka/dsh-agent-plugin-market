name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.34.1
  DSH_VERSION: 0.1.1-rc.2
  DSH_HOOKS_CODEX_VERSION: 0.1.1-rc.1
  DSH_HOOK_PROTOCOL_VERSION: 0.1.1-rc.1

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: node --check lib/*.js test/*.test.js
      - run: git diff --check

  dsh-web-smoke:
    name: DSH web smoke (${{ matrix.optional-hooks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optional-hooks: [absent, present]

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Pack plugin
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/plugin-pack"
          echo "PLUGIN_TARBALL=$(printf '%s' "$RUNNER_TEMP"/plugin-pack/*.tgz)" >> "$GITHUB_ENV"

      - name: Start DSH web with plugin
        env:
          OPTIONAL_HOOKS: ${{ matrix.optional-hooks }}
        run: |
          set -euo pipefail

          export DSH_HOME="$RUNNER_TEMP/dsh-home-$OPTIONAL_HOOKS"
          dsh() { pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" "$@"; }

          dsh plugin --profile web add "$PLUGIN_TARBALL"
          if [ "$OPTIONAL_HOOKS" = present ]; then
            dsh plugin --profile web add "@deepseek-ai/dsh-hooks-codex@$DSH_HOOKS_CODEX_VERSION" "@deepseek-ai/dsh-hook-protocol@$DSH_HOOK_PROTOCOL_VERSION"
          fi

          port=3080
          log="$RUNNER_TEMP/dsh-web-$OPTIONAL_HOOKS.log"
          DSH_TELEMETRY_MODE=DISABLED DSH_PERMISSION_MODE=danger-full-access dsh web --host 127.0.0.1 --port "$port" --no-open >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              echo "dsh exited before serving http://127.0.0.1:$port/"
              sed -n '1,240p' "$log"
              exit 1
            fi

            if curl -fsS "http://127.0.0.1:$port/" >"$RUNNER_TEMP/dsh-index.html" 2>/dev/null; then
              kill -0 "$pid"
              exit 0
            fi

            sleep 1
          done

          echo "timed out waiting for http://127.0.0.1:$port/"
          sed -n '1,240p' "$log"
          exit 1
