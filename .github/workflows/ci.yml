name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  PNPM_VERSION: 10.34.1
  DSH_VERSION: 0.2.1-rc.4

jobs:
  resolve-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: matrix
        run: node .github/resolve-dsh-matrix.cjs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: |
          for file in lib/*.js test/*.test.js; do
            node --check "$file" || exit
          done
      - run: git diff --check

  dsh-web-smoke:
    name: 'DSH ${{ matrix.target.label }} ${{ matrix.target.version }} web smoke (profile hooks deps: ${{ matrix.profile-hooks }})'
    needs: resolve-dsh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve-dsh.outputs.targets) }}
        profile-hooks: [absent, present]
    env:
      DSH_VERSION: ${{ matrix.target.version }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Enforce the declared range with the pinned development preflight;
      # older tested releases may not implement engines.dsh checks themselves.
      - name: Check declared DSH compatibility
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { evaluatePluginCompatibility } from '@deepseek-ai/dsh-app-boot'
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'))
          if (evaluatePluginCompatibility(manifest, {}, process.env.DSH_VERSION)) {
            throw new Error(`DSH ${process.env.DSH_VERSION} is outside the declared compatibility range; review the new release`)
          }
          JS

      - name: Pack plugin
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/plugin-pack"
          echo "PLUGIN_TARBALL=$(printf '%s' "$RUNNER_TEMP"/plugin-pack/*.tgz)" >> "$GITHUB_ENV"

      - name: Start DSH web with plugin
        env:
          PROFILE_HOOKS: ${{ matrix.profile-hooks }}
        run: |
          set -euo pipefail

          export DSH_HOME="$RUNNER_TEMP/dsh-home-$PROFILE_HOOKS"
          # Pin wildcard plugin peers and framework companions in both dlx and
          # the profile's child pnpm installs to the tested DSH release cohort.
          export npm_config_global_pnpmfile="$GITHUB_WORKSPACE/.github/pin-dsh.cjs"
          export npm_config_cache_dir="$RUNNER_TEMP/dsh-smoke-cache-$PROFILE_HOOKS"
          dsh() { pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" "$@"; }

          profile="$DSH_HOME/profiles/web"
          # Initialize with the tested CLI before creating the profile manifest.
          test ! -e "$profile/package.json"
          bootstrap_log="$RUNNER_TEMP/dsh-bootstrap.log"
          if ! dsh --profile web --dump-config > "$bootstrap_log" 2>&1; then
            echo "Failed to initialize the DSH $DSH_VERSION profile"
            sed -n '1,240p' "$bootstrap_log" | sed -E 's/(token=)[^ )]+/\1<redacted>/g'
            exit 1
          fi
          test -f "$profile/pnpm-workspace.yaml" || { echo 'DSH did not initialize pnpm-workspace.yaml'; exit 1; }
          # Profile plugins must be able to import their optional bridge.
          # Check both actual absence and explicit installation, not CLI inventory.
          packages=("$PLUGIN_TARBALL")
          if [ "$PROFILE_HOOKS" = present ]; then
            packages+=("@deepseek-ai/dsh-hooks-codex@$DSH_VERSION" "@deepseek-ai/dsh-hook-protocol@$DSH_VERSION")
          fi
          cat > "$profile/package.json" <<EOF
          {
            "name": "dsh-profile-web",
            "private": true,
            "dsh": {
              "profile": {
                "bundles": ["@deepseek-ai/dsh-base", "@deepseek-ai/dsh-web-app", "dsh-agent-plugin-market"]
              }
            }
          }
          EOF
          pnpm --dir "$profile" add "${packages[@]}"

          port=3080
          log="$RUNNER_TEMP/dsh-web-$PROFILE_HOOKS.log"
          DSH_TELEMETRY_MODE=DISABLED DSH_PERMISSION_MODE=danger-full-access dsh --profile web --host 127.0.0.1 --port "$port" --no-open >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          redact_log() {
            sed -n '1,240p' "$log" | sed -E 's/(token=)[^ )]+/\1<redacted>/g'
          }

          cookie_jar="$RUNNER_TEMP/dsh-web-$PROFILE_HOOKS.cookies"
          auth_url=""
          for _ in $(seq 1 60); do
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || true
              echo "dsh exited before serving http://127.0.0.1:$port/"
              redact_log
              exit 1
            fi

            if [ -z "$auth_url" ]; then
              auth_url="$(sed -nE "s#^dsh web: (http://127[.]0[.]0[.]1:$port/[^ ]*).*#\\1#p" "$log" | tail -n 1)"
            fi

            if [ -n "$auth_url" ] && curl --connect-timeout 2 --max-time 5 -fsSL -c "$cookie_jar" -b "$cookie_jar" "$auth_url" >"$RUNNER_TEMP/dsh-index.html" 2>/dev/null; then
              if ! kill -0 "$pid" 2>/dev/null; then
                echo 'DSH exited after serving the shell'
                redact_log
                exit 1
              fi
              # A served shell alone does not prove the packed plugin activated.
              state="$RUNNER_TEMP/market-state-$PROFILE_HOOKS.json"
              if curl --connect-timeout 2 --max-time 5 -fsS -b "$cookie_jar" \
                -H 'Content-Type: application/json' \
                -H "Origin: http://127.0.0.1:$port" \
                --data '{"type":"client-request","rpcId":"market-smoke","method":"get-state","payload":{}}' \
                "http://127.0.0.1:$port/agent-plugin-market/get-state" >"$state" 2>/dev/null; then
                node --input-type=module - "$state" <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const response = JSON.parse(readFileSync(process.argv[2], 'utf8'))
          assert.equal(response.type, 'server-response')
          assert.equal(response.rpcId, 'market-smoke')
          assert.equal(response.result?.ok, true)
          assert.deepEqual(response.result.value.markets, [])
          assert.equal(response.result.value.scope.kind, 'global')
          assert.equal(response.result.value.hooksBridge.available, process.env.PROFILE_HOOKS === 'present')
          assert.equal(response.result.value.hooksBridge.installCommand,
            `pnpm --dir "$DSH_PROFILE_DIR" add @deepseek-ai/dsh-hooks-codex@${process.env.DSH_VERSION} @deepseek-ai/dsh-hook-protocol@${process.env.DSH_VERSION}`)
          JS
                exit 0
              fi
            fi

            sleep 1
          done

          echo "timed out waiting for http://127.0.0.1:$port/"
          redact_log
          exit 1
